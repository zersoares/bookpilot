<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — BookPilot AI</title>
<meta name="description" content="That page does not exist on BookPilot AI.">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/fonts/fonts.css">
<link rel="stylesheet" href="/assets/css/design-system.css">
<link rel="stylesheet" href="/assets/css/landing.css">
<script>
  try {
    var t = localStorage.getItem('bookpilot.theme');
    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
</script>
<style>
  .bp-404 { max-width: 640px; margin: 0 auto; padding: var(--bp-20) var(--bp-6); text-align: center; }
  .bp-404__code { font-size: 0.74rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--bp-text-subtle); }
  .bp-404__actions { display: flex; gap: var(--bp-3); justify-content: center; flex-wrap: wrap; margin-top: var(--bp-8); }
</style>
</head>
<body>
<a class="bp-skip-link" href="#main">Skip to content</a>
<header class="bp-nav">
  <div class="bp-nav__inner">
    <a class="bp-logo" href="/"><span class="bp-logo__mark" aria-hidden="true"></span> BookPilot <span class="bp-logo__ai">AI</span></a>
    <div class="bp-nav__actions">
      <a class="bp-btn bp-btn--ghost bp-btn--sm" href="/">Product</a>
      <a class="bp-btn bp-btn--primary bp-btn--sm" href="/app.html#/signup">Start free</a>
    </div>
  </div>
</header>
<main id="main" class="bp-404">
  <p class="bp-404__code">Error 404</p>
  <h1 class="bp-display" style="font-size:2.1rem;margin:var(--bp-2) 0 var(--bp-3)">Page not found</h1>
  <p class="bp-lead">That address does not point at anything here. It may have moved, or never existed.</p>
  <div class="bp-404__actions">
    <a class="bp-btn bp-btn--primary" href="/">Back to the homepage</a>
    <a class="bp-btn bp-btn--ghost" href="/app.html">Open the app</a>
  </div>
</main>
<script type="module" src="/js/cookie-notice.js"></script>
</body>
</html>
