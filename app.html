<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BookPilot AI</title>
<meta name="description" content="BookPilot AI — your AI marketing manager for books.">
<!-- The app is a private workspace; nothing here belongs in an index. -->
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">

<link rel="stylesheet" href="/fonts/fonts.css">
<link rel="stylesheet" href="/assets/css/design-system.css">
<link rel="stylesheet" href="/assets/css/app.css">
<link rel="stylesheet" href="/assets/css/builder.css">

<script>
  /* Theme before first paint, so a dark-mode user never gets a white
     flash. Duplicated from theme.js on purpose — a module import would
     run after the first paint. */
  try {
    var t = localStorage.getItem('bookpilot.theme');
    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
</script>
</head>
<body>
<noscript>
  <div style="max-width:640px;margin:12vh auto;padding:24px;font-family:system-ui;line-height:1.6">
    <h1 style="font-size:1.4rem">BookPilot AI needs JavaScript</h1>
    <p>The workspace is an application rather than a set of pages, so it can't run with JavaScript
    switched off. The <a href="/">product overview</a>, the
    <a href="/privacy.html">privacy policy</a> and the
    <a href="/terms.html">terms</a> all work without it.</p>
  </div>
</noscript>

<script type="module" src="/js/app.js"></script>
</body>
</html>
