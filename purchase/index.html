<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your purchase — BookPilot AI</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/fonts/fonts.css">
<link rel="stylesheet" href="/assets/css/design-system.css">
<link rel="stylesheet" href="/assets/css/landing.css">
<script>
  try {
    var t = localStorage.getItem('bookpilot.theme');
    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
</script>
<style>
  .bp-thanks { max-width: 620px; margin: 0 auto; padding: var(--bp-16) var(--bp-6) var(--bp-20); text-align: center; }
  .bp-thanks h1 { font-family: var(--bp-font-serif); font-weight: 400; margin: 0 0 var(--bp-3); }
  .bp-thanks p { color: var(--bp-text-muted); }
  .bp-thanks .bp-btn { margin-top: var(--bp-4); }
</style>
<link rel="stylesheet" href="/assets/css/home-arrow.css">
</head>
<body>
<a class="bp-skip-link" href="#main">Skip to content</a>
<header class="bp-nav">
  <div class="bp-nav__inner">
    <a class="bp-logo" href="/"><span class="bp-logo__mark" aria-hidden="true"></span> BookPilot <span class="bp-logo__ai">AI</span></a>
    <nav class="bp-nav__links" aria-label="Sections">
      <a class="bp-nav__link" href="/books/">Books</a>
      <a class="bp-nav__link" href="/book-auditor/">Book Quality Auditor</a>
      <a class="bp-nav__link" href="/blog/">Blog</a>
    </nav>
  </div>
</header>

<main id="main" class="bp-thanks">
  <div id="view" aria-live="polite"><h1>Thank you</h1><p>Confirming your payment…</p></div>
</main>

<footer class="bp-footer">
  <div class="bp-footer__legal">
    <div class="bp-footer__legal-inner">
      <span>© <span id="year">2026</span> BookPilot AI</span>
      <span>
        <a href="/sell-your-book/">Sell your book</a> ·
        <a href="/privacy.html">Privacy</a> ·
        <a href="/terms.html">Terms</a> ·
        <a href="/cookies.html">Cookies</a> ·
        <a href="/contact/">Contact</a>
      </span>
    </div>
  </div>
</footer>
<script>
(function () {
  var view = document.getElementById('view');
  var sessionId = new URLSearchParams(location.search).get('session_id') || '';
  function el(tag, cls, text) { var n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }
  function show() { view.replaceChildren.apply(view, arguments); }

  if (!/^cs_[A-Za-z0-9_]+$/.test(sessionId)) {
    show(el('h1', null, 'We couldn’t find your order'), el('p', null, 'Open the link in your receipt email, or write to hello@bookpilot.org and we will help.'));
    return;
  }

  var tries = 0;
  function poll() {
    fetch('/api/bp-seller/order?session_id=' + encodeURIComponent(sessionId), { headers: { Accept: 'application/json' } })
      .then(function (r) { return r.json(); })
      .then(function (o) {
        if (o.status === 'ready') {
          var a = el('a', 'bp-btn bp-btn--primary bp-btn--lg', 'Download your book');
          a.href = o.downloadUrl;
          show(el('h1', null, 'Thank you'), el('p', null, o.title ? '“' + o.title + '” is yours.' : 'Your book is ready.'), a,
            el('p', null, o.limited ? 'This link has reached its download limit. Write to hello@bookpilot.org for a new one.' : 'We also emailed you this link. It works up to 10 times. You can ask for a refund within 14 days at hello@bookpilot.org.'));
        } else if (o.status === 'unavailable') {
          show(el('h1', null, 'This order is not available'), el('p', null, 'It was refunded or is under review. Write to hello@bookpilot.org if you have questions.'));
        } else if (++tries < 20) {
          setTimeout(poll, 1500);
        } else {
          show(el('h1', null, 'Payment received'), el('p', null, 'Your download link is on its way by email. If it has not arrived in a few minutes, write to hello@bookpilot.org.'));
        }
      })
      .catch(function () {
        if (++tries < 20) setTimeout(poll, 2000);
        else show(el('h1', null, 'We couldn’t load your order'), el('p', null, 'Please check your email for the download link, or write to hello@bookpilot.org.'));
      });
  }
  poll();
  document.getElementById('year').textContent = String(new Date().getFullYear());
})();
</script>
<script type="module" src="/js/cookie-notice.js"></script>
</body>
</html>
